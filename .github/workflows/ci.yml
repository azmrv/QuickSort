name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint_and_test:
    permissions:
      contents: read # CodeQL: least-privilege — CI only reads sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        # dtolnay/rust-toolchain replaces the abandoned actions-rs/toolchain@v1
        # (unmaintained since 2020, broken on Node 20+ runners).
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        # Workspace includes src-tauri (Tauri 2) -> WebKitGTK 4.1 needed to link.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Run linting and formatting checks
        # context-menu-dll is Windows-only; its windows 0.62 dependency pulls
        # windows-future 0.3.2, which does not compile on Linux runners.
        run: |
          cargo fmt --check
          cargo clippy --workspace --exclude context-menu-dll -- -D warnings

      - name: Run tests
        run: cargo test --workspace --exclude context-menu-dll