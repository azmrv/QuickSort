name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        # dtolnay/rust-toolchain replaces the abandoned actions-rs/toolchain@v1
        # (unmaintained since 2020, broken on Node 20+ runners).
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        # Workspace includes src-tauri (Tauri 2) -> WebKitGTK 4.1 needed to link.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Run linting and formatting checks
        run: |
          cargo fmt --check
          cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace