name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build context-menu DLL (release)
        run: cargo build -p context-menu-dll --release

      - name: Build Tauri app (release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On tag push: create/update GitHub Release with NSIS installer
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('QuickSort {0}', github.ref_name) || '' }}
          releaseBody: "See the assets below for download options."
          releaseDraft: false
          prerelease: false

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = "0.2.0"
          if ("${{ github.ref_name }}" -match "^v(\d+\.\d+\.\d+)$") {
            $version = $Matches[1]
          }
          $releaseDir = "src-tauri/target/release"
          $portableName = "QuickSort-$version-portable"
          New-Item -ItemType Directory -Path $portableName -Force | Out-Null

          # Copy exe + DLL + icon
          Copy-Item "$releaseDir/quicksort.exe" "$portableName/" -ErrorAction Stop
          Copy-Item "$releaseDir/context_menu_dll.dll" "$portableName/" -ErrorAction Stop
          New-Item -ItemType Directory -Path "$portableName/resources" -Force | Out-Null
          Copy-Item "resources/quicksort.ico" "$portableName/resources/" -ErrorAction Stop

          Compress-Archive -Path "$portableName/*" -DestinationPath "$portableName.zip"
          $size = ((Get-Item "$portableName.zip").Length / 1MB).ToString('F1')
          Write-Host "Created: $portableName.zip ($size MB)"
          echo "PORTABLE_ZIP=$portableName.zip" >> $env:GITHUB_ENV
          echo "PORTABLE_NAME=$portableName" >> $env:GITHUB_ENV

      # Always upload as workflow artifact (downloadable from Actions tab)
      - name: Upload portable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PORTABLE_NAME }}
          path: ${{ env.PORTABLE_ZIP }}
          retention-days: 30

      # On tag push: also attach to GitHub Release
      - name: Upload portable to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.PORTABLE_ZIP }}
