name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build context-menu DLL
        run: cargo build -p context-menu-dll --release

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "QuickSort ${{ github.ref_name }}"
          releaseBody: "See the assets below for download options."
          releaseDraft: false
          prerelease: false

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Replace("v", "")
          $releaseDir = "src-tauri/target/release"
          $bundleDir = "$releaseDir/bundle"

          # Find the NSIS unpacked directory (contains the actual exe + dll)
          $nsisDir = Get-ChildItem -Path "$bundleDir/nsis" -Directory -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -like "*quicksort*" } |
                     Select-Object -First 1 -ExpandProperty FullName

          # Fallback: look in windows-release
          if (-not $nsisDir) {
              $nsisDir = Get-ChildItem -Path "$bundleDir" -Directory -Recurse -ErrorAction SilentlyContinue |
                         Where-Object { $_.Name -eq "quicksort" } |
                         Select-Object -First 1 -ExpandProperty FullName
          }

          # Build portable from release output
          $portableName = "QuickSort-$version-portable"
          New-Item -ItemType Directory -Path $portableName -Force | Out-Null

          # Copy exe from target/release
          Copy-Item "$releaseDir/quicksort.exe" "$portableName/" -ErrorAction SilentlyContinue
          # Copy DLL
          Copy-Item "$releaseDir/context_menu_dll.dll" "$portableName/" -ErrorAction SilentlyContinue
          # Copy icon
          New-Item -ItemType Directory -Path "$portableName/resources" -Force | Out-Null
          Copy-Item "resources/quicksort.ico" "$portableName/resources/" -ErrorAction SilentlyContinue

          # Create ZIP
          if (Test-Path "$portableName.zip") { Remove-Item "$portableName.zip" }
          Compress-Archive -Path "$portableName/*" -DestinationPath "$portableName.zip"

          Write-Host "Created: $portableName.zip ($(((Get-Item "$portableName.zip").Length / 1MB).ToString('F1')) MB)"
          echo "PORTABLE_ZIP=$portableName.zip" >> $env:GITHUB_ENV

      - name: Upload portable ZIP to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.PORTABLE_ZIP }}
