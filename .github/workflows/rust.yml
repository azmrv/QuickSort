name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Build workspace
      run: cargo build --workspace --verbose

    - name: Run tests (domain)
      run: cargo test -p quicksort-domain --verbose

    - name: Run tests (application)
      run: cargo test -p quicksort-application --verbose

    - name: Run tests (infrastructure)
      run: cargo test -p quicksort-infrastructure --verbose

    - name: Run tests (ipc-contract)
      run: cargo test -p quicksort-ipc-contract --verbose

    - name: Clippy
      run: cargo clippy --workspace -- -D warnings

    - name: Format check
      run: cargo fmt --check
