[package]
name = "context-menu-dll"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# NOTE: do NOT add a dependency on ../src-tauri back here. The DLL must remain an
# independent component: src-tauri's build script validates the DLL resource
# (`../target/release/context_menu_dll.dll`) and fails when it does not exist yet,
# which creates a build-order cycle when compiling the DLL for the first time on CI.
[dependencies]
quicksort-ipc-contract = { path = "../crates/quicksort-ipc-contract" }
log = "0.4"
simplelog = "0.12"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }
windows-implement = "0.60.2"
windows-core = "0.62.2"
parking_lot = "0.12"
anyhow = "1"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2"
bytes = "1.12.0"




[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
